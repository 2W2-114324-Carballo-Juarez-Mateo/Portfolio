<section class="min-h-screen flex items-center pt-16 pb-16 px-4">
  <div class="max-w-6xl mx-auto w-full">

    <div class="text-center mb-12 fade-in" [style]="{ 'animation-delay': '0.1s' }">
      <h2 class="text-3xl font-bold mb-3">{{ 'skills.title' | translate }}</h2>
      <p class="text-gray-400 text-lg">{{ 'skills.subtitle' | translate }}</p>
    </div>

    @for (category of categories; track category.title; let ci = $index) {
      <div class="mb-10">
        <h3
          class="text-xl font-semibold mb-4 text-[oklch(82.8%_0.111_230.318)] fade-in"
          [style]="{ 'animation-delay': (0.2 + ci * 0.3) + 's' }"
        >
          {{ category.title | translate }}
        </h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
          @for (skill of category.skills; track skill.name; let si = $index) {
            <div
              class="skill-card fade-in"
              [style]="{ 'animation-delay': (0.4 + ci * 0.3 + si * 0.12) + 's' }"
            >
              <img
                [src]="skill.icon"
                [alt]="skill.name"
                class="w-10 h-10"
                loading="lazy"
              />
              <span class="skill-name">{{ skill.name }}</span>
            </div>
          }
        </div>
      </div>
    }

  </div>
</section>
